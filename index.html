<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;

  background-image: url("./bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  font-family: system-ui, sans-serif;
  overflow: hidden;
  padding: 16px;
}


    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* ---------------- LOCKSCREEN ---------------- */
    .lockscreen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      z-index: 20000;
      padding: 18px;
    }

    .lock-wrap {
      width: min(420px, 92vw);
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .lock-card {
      width: 100%;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.12);
      text-align: center;
    }

    .lock-title {
      font-weight: 800;
      font-size: 16px;
      opacity: .75;
      margin-bottom: 10px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 6px;
      min-height: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.18);
    }
    .dot.filled { background: rgba(0,0,0,.55); }

    .lock-hint {
      font-size: 12px;
      opacity: .6;
      margin-top: 8px;
    }

    /* ✅ Numpad (separat unter der Karte) */
    .pad {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      touch-action: manipulation;
    }

    .key {
      height: 64px;
      width: 100%;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 22px;
      font-weight: 800;
      background: rgba(255,255,255,.9);
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease;
    }
    .key:active { transform: scale(.97); }

    .key.secondary {
      background: rgba(229,231,235,.95);
      font-size: 18px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    .shake { animation: shake .25s ease; }

    /* ---------------- MAIN APP ---------------- */
    .app {
      display: none;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      position: relative;
      z-index: 1;
    }

    .emoji {
      font-size: clamp(72px, 14vw, 120px);
      line-height: 1;
      text-align: center;
      margin: 10px auto 40px;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button.mainbtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
      text-align: center;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0 30px;
    }

    .love-text {
      font-size: 22px;
      font-weight: 700;
      color: #ff1f68;
      margin-bottom: 14px;
    }

    .fireworks {
      display: block;
      width: 100%;
      max-width: 380px;
      height: auto;
      margin: 20px auto;
      border-radius: 18px;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ---------------- POPUP OVERLAY ---------------- */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      z-index: 10000;
      padding: 16px;
    }

    .modal {
      width: min(420px, 92vw);
      background: rgba(255,255,255,.95);
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      text-align: center;
      animation: pop .2s ease;
      position: relative;
    }

    .modal h3 {
      margin: 6px 0 8px;
      font-size: clamp(22px, 4vw, 28px);
    }

    .counter {
      font-size: 14px;
      opacity: .75;
      margin-bottom: 14px;
    }

    .modal-playground {
      position: relative;
      height: 120px;
      width: 100%;
    }

    .modal-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--yes);
      color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      transition: background .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .modal-btn:hover { background: var(--yesHover); }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <!-- ✅ LOCKSCREEN -->
  <div class="lockscreen" id="lockscreen">
    <div class="lock-wrap">
      <div class="lock-card" id="lockCard">
        <div class="lock-title">Enter your pin</div>

        <div class="dots" id="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="lock-hint">Tip: November</div>
      </div>

      <!-- ✅ Numpad sichtbar -->
      <div class="pad" id="pad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key secondary" data-action="clear">C</button>
        <button class="key" data-key="0">0</button>
        <button class="key secondary" data-action="back">⌫</button>
      </div>
    </div>
  </div>

  <!-- ✅ Popup -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Bisch diar sicher? 🥹</h3>
      <div class="counter" id="counterText">Klicks: 0/10</div>

      <div class="modal-playground" id="playground">
        <button class="modal-btn" id="confirmYes" type="button">Jo</button>
      </div>
    </div>
  </div>

  <!-- ✅ MAIN APP -->
  <div class="app" id="app">
    <main class="card">
      <div class="emoji">🥹</div>

      <h1>Michelle willsch du mis Valentinstagsdate si?</h1>

      <section class="button-zone" id="zone">
        <button class="mainbtn" id="yesBtn">Jo</button>
        <button class="mainbtn" id="noBtn">Nei</button>
      </section>

      <div class="hint" id="hint">“Nei” isch bitzli schüch</div>

      <section class="result" id="result">
        <h2>YAY! 🎉</h2>
        <div class="love-text">I liaba dii ❤️</div>
        <img class="fireworks" src="./mfoto.jpg" alt="Valentine Foto" />
      </section>
    </main>
  </div>

  <script>
    /* ---------------- PIN ---------------- */
    const CORRECT_PIN = "071125"; // <-- HIER aendern
    const PIN_LEN = CORRECT_PIN.length;

    const lockscreen = document.getElementById("lockscreen");
    const lockCard = document.getElementById("lockCard");
    const dotsEl = document.getElementById("dots");
    const pad = document.getElementById("pad");
    const app = document.getElementById("app");

    let pin = "";

    function renderDots() {
      const dots = dotsEl.querySelectorAll(".dot");
      dots.forEach((d, i) => d.classList.toggle("filled", i < pin.length));
    }

    function resetPin(shake=false) {
      if (shake) {
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth;
        lockCard.classList.add("shake");
      }
      pin = "";
      renderDots();
    }

    function unlock() {
      lockscreen.style.display = "none";
      app.style.display = "grid";
    }

    pad.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const key = btn.dataset.key;
      const action = btn.dataset.action;

      if (action === "clear") { resetPin(false); return; }
      if (action === "back") { pin = pin.slice(0, -1); renderDots(); return; }

      if (key != null) {
        if (pin.length >= PIN_LEN) return;
        pin += key;
        renderDots();

        if (pin.length === PIN_LEN) {
          if (pin === CORRECT_PIN) unlock();
          else setTimeout(() => resetPin(true), 120);
        }
      }
    });

    renderDots();

    /* ---------------- Valentine Logic ---------------- */
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    const overlay = document.getElementById("overlay");
    const confirmYes = document.getElementById("confirmYes");
    const counterText = document.getElementById("counterText");
    const playground = document.getElementById("playground");

    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width / 2) - e.clientX, (b.top + b.height / 2) - e.clientY);
      if (d < 140) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    let confirmClicks = 0;
    const targetClicks = 10;

    function updateCounter() { counterText.textContent = `Klicks: ${confirmClicks}/${targetClicks}`; }

    function moveConfirmButtonRandom() {
      const area = playground.getBoundingClientRect();
      const btn = confirmYes.getBoundingClientRect();
      const maxX = area.width - btn.width;
      const maxY = area.height - btn.height;
      const x = Math.random() * Math.max(0, maxX);
      const y = Math.random() * Math.max(0, maxY);
      confirmYes.style.left = x + "px";
      confirmYes.style.top = y + "px";
      confirmYes.style.transform = "none";
    }

    function finishYesFlow() {
      overlay.style.display = "none";
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    }

    yesBtn.addEventListener("click", () => {
      confirmClicks = 0;
      updateCounter();
      overlay.style.display = "grid";
      confirmYes.style.left = "50%";
      confirmYes.style.top = "50%";
      confirmYes.style.transform = "translate(-50%, -50%)";
    });

    confirmYes.addEventListener("click", () => {
      confirmClicks += 1;
      updateCounter();
      if (confirmClicks >= targetClicks) { finishYesFlow(); return; }
      moveConfirmButtonRandom();
    });
  </script>
</body>
</html>
